# ===============================================
# Maritime Workflow Orchestration Configuration
# ===============================================
#
# Location: config/workflow_config.yml
#
# REQUIRED: Database credentials must be set in .env file (secrets, not stored here):
#   DB_NAME=your_database_name
#   DB_USER=your_database_user
#   DB_PASSWORD=your_database_password
#   DB_HOST=localhost (or your database host)
#   DB_PORT=5432 (default PostgreSQL port)
#
# Graph algorithm configuration (H3 resolution, weights, layers) is loaded automatically
# from the installed package (src/nautical_graph_toolkit/data/graph_config.yml).
# Override by setting graph_config_path to an explicit relative path if needed.
#
# This config defines workflow orchestration parameters:
# - Which pipeline steps to run (base_graph → fine_graph → weighting → pathfinding)
# - Geographic area of interest (departure and arrival ports)
# - Port definitions and precise coordinates for routing
# - Vessel specifications (draft, height, safety margins)
# - Output paths and file naming conventions

# --- Configuration Paths ---
# null = auto-resolve graph_config.yml from the installed package (recommended).
# Set to a relative path (from project root) to use a custom graph config override.
graph_config_path: null

# --- Database Configuration ---
database:
  # --- Both backends ---
  data_dir: "data"              # Input data directory (relative to project root)

  # --- GeoPackage backend ---
  geopackage_filename: "enc_west.gpkg"  # ENC source file, located in data_dir above

  # --- PostGIS backend: schema names (ignored by GeoPackage/SpatiaLite backends) ---
  enc_schema: "enc_west"        # Schema containing S-57 ENC layers
  graph_schema: "graph"         # Schema for graph tables
  route_schema: "routes"        # Schema for route storage
  grid_schema:  "grid"          # Schema for generated Grids

# --- Workflow Control ---
# Enable/disable major pipeline steps
workflow:
  run_base_graph: true            # Step 1: Create base 0.3NM resolution graph
  run_fine_graph: true            # Step 2: Create fine/H3 high-resolution graph
  run_weighting: true             # Step 3: Apply weighting system
  run_pathfinding: true           # Step 4: Calculate optimal routes

# ===============================================
# STEP 1: BASE GRAPH CONFIGURATION
# ===============================================
# Creates initial coarse-resolution graph (0.3 NM spacing)
# Used to establish AOI and baseline routing before fine-resolution work

base_graph:
  # Area of Interest (AOI) definition
  # Two ports define the geographic scope; expansion extends the bounding box
  departure_port: "San Francisco"
  arrival_port: "Los Angeles"
  expansion_nm: 30.0              # Expansion of bounding box in nautical miles
                                  # Expands from the ports' bounding box, not port points

  # Graph generation parameters
  layer_table: "seaare"           # Primary navigable layer from S-57
  spacing_nm: 0.3                 # Node spacing in nautical miles
  reduce_distance_nm: 3           # Safety buffer reduction (0 = no reduction, 3 = standard maritime safety)

  # Output naming conventions
  graph_name: "base_graph"        # Table/file name for base graph
  base_route_name: "base_route"   # Route identifier name
  base_routes_table_name: "base_routes"  # Table name in routes GeoPackage (GeoPackage backend)

# ===============================================
# STEP 2: FINE/H3 GRAPH CONFIGURATION
# ===============================================
# Creates high-resolution graph for detailed routing
# Supports two modes: regular grid ("fine") or hexagonal ("h3")

fine_graph:
  # Graph resolution mode and naming
  # NOTE: Graph table names are automatically constructed from these values:
  #   - Undirected graph: {mode}_graph_{name_suffix}    (e.g., "h3_graph_20")
  #   - Weighted graph: {mode}_graph_wt_{name_suffix}   (e.g., "h3_graph_wt_20")
  mode: "fine"                      # Options: "fine" (regular grid) or "h3" (hexagonal)
  name_suffix: "20"                 # Suffix for graph table/file names

  # Route buffer configuration
  load_base_route: true           # Load pre-computed base route from step 1
  buffer_size_nm: 30.0            # Buffer distance around route (NM)

  # Optional area slicing (for testing/optimization/reducing memory usage)
  # Set slice_buffer=true to restrict processing to a specific geographic region
  # Useful for: memory-constrained systems, testing, or regional analysis
  slice_buffer: false
  slice_south_degree: 37.0        # Southern latitude limit (if slice_buffer=true)
  slice_north_degree: 38.1        # Northern latitude limit (if slice_buffer=true)
  #slice_west_degree: None #-123.5       # Western longitude limit (if slice_buffer=true) - negative = West
  #slice_east_degree: None #-122.0       # Eastern longitude limit (if slice_buffer=true) - negative = West

  # Fine grid specific parameters (when mode: "fine")
  # Regular rectangular grid for high-precision routing
  fine_spacing_nm: 0.2            # Node spacing in NM (smaller = denser graph)
  fine_max_edge_factor: 3.0       # Max edge length multiplier
  fine_bridge_components: true    # Bridge disconnected components

  # H3 hexagonal grid parameters inherited from graph_config.yml
  # See src/nautical_graph_toolkit/data/graph_config.yml for h3_settings

  # Port definitions for route calculation on fine graph
  # These are the actual routing start/end points (may differ from base_graph ports)
  departure_port: "San Francisco Arrival"
  departure_coords: { lon: -122.400, lat: 37.805 }  # Pilot boarding area (customizable)
  arrival_port: "SF Pilot"
  arrival_coords: { lon: -122.780, lat: 37.006 }     # Destination port (customizable)

  # Save options for fine/H3 graph
  save_gpkg: true                 # Save to GeoPackage (fastest, portable)
  save_postgis: false             # Save to PostGIS (standard insert)
  save_postgis_optimized: true    # Save to PostGIS (optimized bulk insert) - needed for weighting
  postgis_chunk_size: 500000      # Batch size for optimized inserts
  drop_existing: true             # Replace existing tables

# ===============================================
# STEP 3: WEIGHTING CONFIGURATION
# ===============================================
# Apply three-tier weighting system:
# - Static weights: Distance-based penalties from features
# - Directional weights: Traffic flow alignment
# - Dynamic weights: Vessel-specific constraints

weighting:
  # Graph table naming
  # IMPORTANT: Graph names are automatically constructed from fine_graph configuration:
  #   - Source (undirected): {fine_graph.mode}_graph_{fine_graph.name_suffix}
  #   - Target (directed): {fine_graph.mode}_graph_wt_{fine_graph.name_suffix}
  # Example with fine_graph.mode="h3" and fine_graph.name_suffix="20":
  #   - source_graph_undirected = "h3_graph_20"
  #   - target_graph_directed = "h3_graph_wt_20"
  # You do NOT need to manually set these values; they are auto-generated by the workflow.

  # Weight manager class: "weights" (standard) or "weights-open" (ML-optimized)
  weights_class: "weights"

  # Global override for GeoPackage processing mode (optional)
  # When set, overrides all individual step gpkg_mode settings below.
  # Useful for troubleshooting (e.g., force "mem" if SpatiaLite R-tree deps are missing).
  # Options: "mem" (GeoPandas in-memory), "sql" (SpatiaLite SQL), or null (use per-step settings)
  override_gpkg_mode: null

  # Sub-step control (can skip completed steps)
  # Each step has an optional gpkg_mode setting:
  #   "mem" = GeoPandas in-memory processing (faster for small/medium graphs)
  #   "sql" = SpatiaLite SQL processing (better for large graphs, requires SpatiaLite extension)
  steps:
    convert_to_directed: true
    convert_to_directed_gpkg_mode: "mem"       # Undirected → directed graph duplication

    enrich_features: true
    enrich_features_gpkg_mode: "sql"            # S-57 feature enrichment (SQL uses R-tree indexes)

    apply_static_weights: true
    apply_static_weights_gpkg_mode: "mem"       # Distance-based feature weights

    apply_directional_weights: true
    apply_directional_weights_gpkg_mode: "mem"  # Traffic flow alignment weights

    apply_dynamic_weights: true
    apply_dynamic_weights_gpkg_mode: "sql"      # Vessel-specific constraint weights

  # Vessel parameters (override defaults from graph_config.yml)
  # These constraints determine navigable water depth and clearance requirements
  vessel:
    draft: 8.0                    # Depth of hull below waterline (meters)
    height: 30.0                  # Height above waterline / air draft (meters)
    beam: 25.0                    # Vessel width (meters)
    length: 150.0                 # Vessel length (meters)
    vessel_type: "cargo"          # Vessel classification: cargo, tanker, passenger, fishing
    ukc_safety_margin: 2.0        # Additional under-keel clearance buffer (meters)
    ver_clearance_margin: 5.0     # Vertical clearance buffer for bridges (meters)
    hor_clearance_margin: 20.0    # Horizontal clearance buffer for obstacles (meters)
    compliance_zone: null         # null = use zone_penalties defaults; or e.g. [2.5, 1.8, 1.3]

  # Environmental conditions
  environment:
    weather_factor: 1.2           # 1.0=good, >1.0=poor (weight multiplier)
    visibility_factor: 1.1        # 1.0=good, >1.0=poor (weight multiplier)
    time_of_day: "day"            # "day" or "night"

  # Feature enrichment configuration
  enrichment:
    include_sources: false        # Store ENC source chart names in edge attributes
    soundg_buffer_meters: 30      # Radius for sounding (depth) point spatial queries (meters)
    work_mem: "512MB"             # PostGIS work memory for spatial operations
    temp_buffers: "512MB"         # PostGIS temp table memory (prevents disk spillover)

  # PostGIS bulk operation tuning (temp table + CTAS patterns)
  # Only used by the _postgis methods during enrichment, static weights, and dynamic weights.
  postgis_bulk:
    maintenance_work_mem: "4GB"   # Memory for CTAS index builds (GiST index recreation)
    ctas_threshold: 0.5           # Use CTAS instead of UPDATE when >50% of rows are touched

  # Static weights usage bands
  # Determines which ENC chart scales contribute to weighting:
  #   Band 3: Approach charts (1:90,000 scale)
  #   Band 4: Coastal/Harbour charts (1:22K-45K scale)
  #   Band 5: Berthing charts (1:4K-12K scale)
  # TIP: Include higher bands for more detailed feature weighting
  static_weights_usage_bands: [3, 4, 5]

  # Static weights processing options
  buffer_method: "auto"           # Buffer calculation method: "auto" (default), "fast" (degrees), "fine" (geodesic)
  aggr_mode: exp                 # Aggregation mode: null (use graph_config default), "max" (GREATEST), or "exp" (MULTIPLY)

  # Buffer zone processing (environmental/regulatory coastal boundaries)
  # Enables coastal buffer zone classification and zone-based routing penalties
  # Detailed configuration (distances, mode, penalties) is in graph_config.yml
  buffer_zones:
    enabled: true                 # Enable buffer zone processing during static weights
    save_buffer_zones: true        # Persist buffer zone geometries as separate PostGIS/GeoPackage tables
    simplify_tolerance: 0.0005    # Land geometry simplification tolerance (degrees). 0 disables. 0.0005 ≈ 55m

# ===============================================
# STEP 4: PATHFINDING CONFIGURATION
# ===============================================
# Calculate optimal routes on weighted graph

pathfinding:
  # Graph table naming
  # Routes are calculated on the weighted graph automatically named:
  #   {fine_graph.mode}_graph_wt_{fine_graph.name_suffix}
  # Example: h3_graph_wt_20 (derived from fine_graph.mode="h3", fine_graph.name_suffix="20")

  # Port definitions for route calculation (final routing endpoints)
  # These may differ from fine_graph ports if different start/end points are desired
#  departure_port: "SF Pilot"
#  departure_coords: {lon: -122.780, lat: 37.006}  # Pilot boarding area (customizable)
#  arrival_port: "San Francisco Arrival"
#  arrival_coords: {lon: -122.400, lat: 37.805}    # Destination port (customizable)

  departure_port: "San Francisco Arrival"
  departure_coords: { lon: -122.400, lat: 37.805 }  # Pilot boarding area (customizable)
  arrival_port: "SF Pilot"
  arrival_coords: {lon: -122.780, lat: 37.006}     # Destination port (customizable)

  # Weight key for routing (must match output from weighting step)
  # Use "adjusted_weight" for final weighted routes (includes all three weight tiers)
  weight_key: "adjusted_weight"

  # Waypoints: integer node IDs the route must pass through (in order).
  # Set to [] (empty) for direct A-to-B routing.
  # Example: force route through specific graph nodes
  # waypoints: [12345, 67890]
  waypoints: []

  # A* algorithm selection
  # Options: "Astar" (basic), "AstarImproved" (heuristic improvements), "AstarMaritime" (two-pass corridor)
  astar_impl: "AstarMaritimeSmooth"  # Default: AstarMaritime for maritime routing with TSS awareness

  # AstarMaritime / AstarMaritimeSmooth corridor parameters
  corridor_buffer_nm: 18.0       # Corridor width around Pass-1 rough path (NM) for Pass-2 optimization
  include_tss: true             # Force-include TSS lanes in corridor (prevents "blind buffer" trap)
  tss_bbox_extend_factor: 0.5   # Extend TSS detection bbox by this factor (0.5 = 50% expansion)

  # Pass-1 (A* scout) backend selection
  pass1_backend: "rustworkx"    # Backend for Pass-1 A* scout: "rustworkx" (fast, Rust-based) or "networkx" (fallback)
  pass1_refresh: true           # Rebuild rustworkx graph before Pass-1; set false to reuse cached graph

  # AstarMaritimeSmooth string-pulling parameters (used when astar_impl="AstarMaritimeSmooth")
  sp_buffer_nm: 0.15             # Obstacle buffer radius around Dijkstra path (NM) for Pass-3 string-pulling

  # Navigability mask for string-pulling containment
  use_land_grid: true             # Subtract land_grid from SP buffer to prevent land-crossing shortcuts
  # channel_layers:               # Optional: override default TSS layers for channel expansion
  #                                 Default: auto (fairwy, rectrc, tsslpt, dwrtpt, rcrtcl when include_tss=True)

  # Fillet smoothing (Route-level, applied after pathfinding)
  apply_smoothing: true        # Enable bearing-merge + circular arc fillet smoothing
  merge_threshold_deg: 1.0     # Max bearing diff to merge consecutive segments (degrees)
  arc_threshold_deg: 3.0       # Min bearing diff to apply fillet arc (degrees)

  # General pathfinding parameters
  min_cost_factor: 1.0          # Minimum cost threshold for edge consideration (1.0 = consider all)
  collect_edge_stats: true      # Collect detailed edge statistics along the route

  # Debug export (AstarMaritimeSmooth only)
  debug_export_gpkg: true      # Export intermediate layers (corridor, obstacles, paths) to debug GeoPackage

  # Export options
  export_weighted_graph: true     # Save final weighted graph to GeoPackage file
  route_filename_template: "detailed_route_{draft}m_draft.geojson"  # Template for output filename

# ===============================================
# OUTPUT CONFIGURATION
# ===============================================
# Workflow auto-creates timestamped subdirectories in base_dir to avoid overwriting previous results.
# Format: {base_dir}/workflow_{graph_name}_{YYYYMMDD_HHMMSS}/
# Example: output/workflow_h3_graph_20260106_112059/

output:
  # Output root directory (workflow creates timestamped subdirectories here)
  # Paths are resolved relative to PROJECT_ROOT (not current working directory)
  # Format: {base_dir}/workflow_{graph_name}_{YYYYMMDD_HHMMSS}/
  # Example: output/workflow_h3_graph_20260106_112059/
  base_dir: "output"      # Root for workflow output folders (default: PROJECT_ROOT/output/)
  log_dir: "docs/logs"    # Where workflow logs and debug files are saved

  # Performance benchmark CSV export (optional)
  benchmarks:
    enabled: true                 # Save performance metrics to CSV files
    base_graph_file: "benchmark_graph_base.csv"        # Base graph timing stats
    fine_graph_file: "benchmark_graph_fine.csv"        # Fine/H3 graph timing stats
    weighted_graph_file: "benchmark_graph_weighted_directed.csv"  # Weighting timing stats

# ===============================================
# DIRECTORY STRUCTURE (v0.1.0+)
# ===============================================
#
# PROJECT_ROOT/
# ├── data/                          # Input: ENC source data (immutable)
# │   └── enc_west.gpkg              # From import_s57.py
# │
# └── output/                        # Output: Workflow artifacts (auto-generated)
#     ├── workflow_h3_graph_20260106_112059/
#     │   ├── base_graph.gpkg
#     │   ├── h3_graph_gpkg_6_11.gpkg
#     │   ├── maritime_routes.gpkg
#     │   └── benchmark_*.csv
#     └── workflow_h3_graph_20260106_143022/
#
# Path Resolution Rules:
#   - database.data_dir: "data" → PROJECT_ROOT/data/
#   - output.base_dir: "output" → PROJECT_ROOT/output/
#   - Absolute paths work: "/custom/path" → /custom/path
#
# CLI Overrides:
#   --data-dir /path/to/enc_data     # Override input location
#   --output-dir /path/to/results    # Override auto-generated output (skips timestamping)

# ===============================================
# LOGGING CONFIGURATION
# ===============================================

logging:
  console_level: "INFO"           # Console output: INFO (normal), DEBUG (verbose), WARNING (minimal)
  file_level: "DEBUG"             # Log file always captures DEBUG level for troubleshooting
  progress_bars: true             # Show tqdm progress bars for long-running operations

# ===============================================
# QUICK REFERENCE FOR END USERS
# ===============================================
#
# SETUP CHECKLIST:
# 1. Create .env file in project root with database credentials
# 2. Ensure S-57 ENC data is loaded in the database
# 3. Review graph_config.yml for H3 resolution settings
# 4. Adjust vessel parameters (draft, height) for your vessel
# 5. Set departure/arrival ports and coordinates for your route
#
# NAMING CONVENTIONS (auto-generated, do not modify):
# - Base graph: {base_graph.graph_name}.gpkg (e.g., base_graph.gpkg)
# - Base route: {base_graph.base_route_name} (e.g., base_route)
# - Fine undirected: {fine_graph.mode}_graph_{fine_graph.name_suffix} (e.g., h3_graph_20)
# - Fine weighted: {fine_graph.mode}_graph_wt_{fine_graph.name_suffix} (e.g., h3_graph_wt_20)
# NOTE: Only modify base_graph.graph_name, base_graph.base_route_name, fine_graph.mode,
#       and fine_graph.name_suffix to customize naming. Other naming fields are auto-generated.
#
# WORKFLOW EXECUTION ORDER (do not skip steps):
# 1. base_graph: Creates initial coarse graph and baseline route
# 2. fine_graph: Creates high-resolution graph from base route buffer
# 3. weighting: Applies feature-based penalties and traffic patterns
# 4. pathfinding: Calculates final optimized route on weighted graph
#
# COMMON ISSUES:
# 1. File not found (enc_west.gpkg):
#    - Run import_s57.py to create ENC source data in data/ directory first
#    - Command: python scripts/import_s57.py --input-dir /path/to/ENC_ROOT \
#                 --output-format gpkg --output-dir data
#
# 2. Output folder location:
#    - Workflow auto-creates: output/workflow_{graph}_{timestamp}/
#    - Manual override: --output-dir /custom/path (skips timestamping)
#    - Each run gets separate folder (prevents overwriting previous results)
#
# 3. Input data location:
#    - Default: data/ (set in database.data_dir)
#    - Override: --data-dir /custom/enc_location
#
# 4. Table not found: Verify fine_graph.mode and fine_graph.name_suffix are set correctly
#    (auto-generated table names depend on these values)
#
# 5. Coordinates out of bounds: Check longitude (negative = West), latitude ranges
#
# 6. Memory errors: Reduce fine_spacing_nm, reduce buffer_size_nm, or enable slice_buffer
#    (slice_buffer restricts area with: slice_south/north_degree, slice_west/east_degree)
#
# 7. Slow performance: Increase spacing_nm, disable unused weighting steps
#
# OUTPUT FILES:
# - GeoPackage files: {base_dir}/{mode}_graph_{suffix}.gpkg (e.g., h3_graph_20.gpkg)
# - Routes (GeoJSON): {base_dir}/detailed_route_{draft}m_draft.geojson
# - Logs: {log_dir}/*.log
# - Benchmarks (CSV): {base_dir}/benchmark_*.csv
