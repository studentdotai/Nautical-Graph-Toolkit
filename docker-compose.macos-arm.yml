services:
  db:
    image: kartoza/postgis:16-3.4--v2024.03.17
    platform: linux/arm64
    container_name: postgis_nautical
    restart: always
    shm_size: 4gb
    environment:
      # Kartoza-specific env vars
      POSTGRES_USER: postgres
      POSTGRES_PASS: postgres
      POSTGRES_DBNAME: enc_db
      ALLOW_IP_RANGE: 0.0.0.0/0
      # Performance tuning via env vars (Kartoza maps to postgresql.conf)
      POSTGRES_SHARED_BUFFERS: 4GB
      POSTGRES_WORK_MEM: 512MB
      POSTGRES_MAINTENANCE_WORK_MEM: 1GB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 12GB
      POSTGRES_RANDOM_PAGE_COST: 1.1
      POSTGRES_MAX_WORKER_PROCESSES: 8
      POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER: 4
      POSTGRES_MAX_WAL_SIZE: 8GB
      POSTGRES_MIN_WAL_SIZE: 2GB
      POSTGRES_CHECKPOINT_TIMEOUT: 15min
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      POSTGRES_MAX_LOCKS_PER_TRANSACTION: 1024
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data: